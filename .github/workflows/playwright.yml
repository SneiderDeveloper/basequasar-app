name: Playwright Tests

on: 
  push:

jobs:
  test:
    name: Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - name: Notify Discord - Start
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{
                "content": "**🧪 Playwright Tests Started...**\n\n📢 *The test execution has begun.*\n\n⏳ Please wait while the tests are running...`\n\n🔎 Status: `IN PROGRESS` 🚀"
            }' \
            https://discord.com/api/webhooks/1343946078772264981/A9JA0M_Y8oPebpba42XBoy7vuaLf4Ks4HU20b9tDmUyPtYlRjb1Zf2vGr80STeXfKKLX

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Create env.js file
        run: |
          echo "const email = '${{ vars.AGIONE_FRONTEND_TEST_USER_EMAIL }}';" > env.js
          echo "const password = '${{ vars.AGIONE_FRONTEND_TEST_USER_PASSWORD }}';" >> env.js
          echo "module.exports = { email, password };" >> env.js

      - name: Cache Playwright Browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v1

      - name: Install dependencies
        run: npm install

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests for setup
        run: npx playwright test --project setup
      - name: Run Playwright tests home
        run: npx playwright test home.spec.ts --trace on
      - name: Run Playwright tests passenger fueling
        run: npx playwright test passenger-fueling.spec.ts
      - name: Run Playwright tests passenger labor work order
        run: npx playwright test passenger-labor-work-order.spec.ts
      - name: Run Playwright tests ramp work order
        run: npx playwright test ramp-work-order.spec.ts --workers 4

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5
        
